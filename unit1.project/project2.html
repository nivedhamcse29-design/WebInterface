<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Card</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
h2{
    color:white;
    margin:20px;
    font-size:32px;
}
.container{
    width:360px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
label{
    font-weight:bold;
    color:#333;
}
input{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}
input:focus{
    border:2px solid #2196f3;
    outline:none;
}
button{
    width:100%;
    padding:12px;
    background:#2196f3;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    background:#1565c0;
    transform:scale(1.05);
}
.card{
    width:360px;
    margin-top:25px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    display:none;
}
.card-header{
    background:#2196f3;
    color:white;
    padding:15px;
    text-align:center;
}
.profile{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:20px auto;
}
.profile img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid #2196f3;
    object-fit:cover;
}
.card-body{
    padding:20px;
}
.card-body p{
    font-size:18px;
    margin:12px 0;
}
#sgrade{
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>
<h2>🎓 Student Profile Card</h2>
<div class="container">
<label><b>Student Photo</b></label>
<input type="file" id="photo" accept="image/*">
<label><b>Student Name</b></label>
<input type="text" id="name" placeholder="Enter Name">
<label><b>Roll Number</b></label>
<input type="text" id="roll" placeholder="Enter Roll Number">
<label><b>Marks</b></label>
<input type="number" id="marks" placeholder="Enter Marks">
<button onclick="displayProfile()">Display Profile</button>
</div>
<div class="card" id="card">
<div class="card-header">
<h3>Student Profile</h3>
</div>
<div class="profile">
<img id="studentImage" src="https://via.placeholder.com/120" alt="Student Photo">
</div>
<div class="card-body">
<p><b>Name :</b> <span id="sname"></span></p>
<p><b>Roll Number :</b> <span id="sroll"></span></p>
<p><b>Marks :</b> <span id="smarks"></span></p>
<p><b>Grade :</b> <span id="sgrade"></span></p>
</div>
</div>
<script>
function displayProfile(){
    let name=document.getElementById("name").value;
    let roll=document.getElementById("roll").value;
    let marks=Number(document.getElementById("marks").value);
    let grade;
    if(marks>=90){
        grade="A+";
    }
    else if(marks>=80){
        grade="A";
    }
    else if(marks>=70){
        grade="B";
    }
    else if(marks>=60){
        grade="C";
    }
    else if(marks>=50){
        grade="D";
    }
    else{
        grade="F";
    }
    document.getElementById("sname").innerHTML=name;
    document.getElementById("sroll").innerHTML=roll;
    document.getElementById("smarks").innerHTML=marks;
    document.getElementById("sgrade").innerHTML=grade;
    document.getElementById("card").style.display="block";
    let file=document.getElementById("photo").files[0];
    if(file){
        let reader=new FileReader();
        reader.onload=function(event){
            document.getElementById("studentImage").src=event.target.result;
        };
        reader.readAsDataURL(file);
    }
}
</script>
</body>
</html>
