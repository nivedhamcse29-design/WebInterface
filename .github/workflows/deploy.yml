name: Deploy WebInterface

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create site folder
        run: mkdir -p site

      - name: Copy Unit 1 projects
        run: |
          mkdir -p site/unit1
          cp unit1.project/project1.html site/unit1/
          cp unit1.project/project2.html site/unit1/

      - name: Build React projects
        shell: bash
        run: |
          set -e

          for unit in unit2.project unit3.project unit4.project unit5.project
          do
            echo "=============================="
            echo "Processing $unit"
            echo "=============================="

            for project in "$unit"/*
            do
              if [ -d "$project" ] && [ -f "$project/package.json" ]
              then
                echo "Building: $project"

                cd "$project"

                npm install --include=dev

                if [ -f "node_modules/.bin/vite" ]
                then
                  chmod +x node_modules/.bin/vite
                fi

                if grep -q '"build"' package.json
                then
                  npm run build
                fi

                cd - > /dev/null

                project_name=$(basename "$project")
                project_name=$(echo "$project_name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

                if [ -d "$project/dist" ]
                then
                  mkdir -p "site/$project_name"
                  cp -r "$project/dist/"* "site/$project_name/"
                elif [ -d "$project/build" ]
                then
                  mkdir -p "site/$project_name"
                  cp -r "$project/build/"* "site/$project_name/"
                fi
              fi
            done
          done

      - name: Copy main index
        run: |
          cp index.html site/index.html

      - name: Add GitHub Pages SPA fallback
        run: |
          cp site/index.html site/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4