<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
            radial-gradient(circle at top left, #e8efff 0, transparent 35%),
            radial-gradient(circle at bottom right, #e9e7ff 0, transparent 35%),
            #f7f8fc;
        color: #172033;
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 65px 20px 45px;
    }

    header h1 {
        margin: 0;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -1px;
        color: #111827;
    }

    header h1::after {
        content: "";
        display: block;
        width: 55px;
        height: 4px;
        margin: 16px auto 0;
        border-radius: 10px;
        background: linear-gradient(90deg, #4f46e5, #06b6d4);
    }

    header p {
        margin-top: 16px;
        color: #64748b;
        font-size: 15px;
        letter-spacing: 0.3px;
    }

    .projects {
        width: 1100px;
        max-width: 92%;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        padding-bottom: 55px;
    }

    .card {
        position: relative;
        background: rgba(255, 255, 255, 0.92);
        padding: 28px;
        border-radius: 20px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 30px rgba(30, 41, 59, 0.07);
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #4f46e5, #06b6d4);
    }

    .card:hover {
        transform: translateY(-8px);
        border-color: #c7d2fe;
        box-shadow: 0 18px 40px rgba(30, 41, 59, 0.13);
    }

    .number {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 20px;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    h2 {
        font-size: 21px;
        margin: 17px 0 10px;
        color: #172033;
    }

    .card p {
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
        margin: 7px 0;
    }

    .tech {
        display: inline-block;
        margin-top: 7px !important;
        color: #0891b2 !important;
        font-size: 12px !important;
        font-weight: 700;
        background: #ecfeff;
        padding: 5px 9px;
        border-radius: 7px;
    }

    .button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 18px;
        padding: 11px 18px;
        background: linear-gradient(135deg, #4f46e5, #2563eb);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 6px 15px rgba(79, 70, 229, 0.2);
        transition: all 0.25s ease;
    }

    .button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #4338ca, #1d4ed8);
        box-shadow: 0 9px 20px rgba(79, 70, 229, 0.3);
    }

    footer {
        margin-top: 15px;
        padding: 28px 20px;
        text-align: center;
        background: #111827;
        color: #94a3b8;
        font-size: 12px;
        letter-spacing: 0.3px;
    }

    @media (max-width: 700px) {
        header {
            padding: 45px 15px 30px;
        }

        header h1 {
            font-size: 30px;
        }

        .projects {
            grid-template-columns: 1fr;
            max-width: 92%;
            gap: 18px;
        }

        .card {
            padding: 23px;
        }
    }

    @media (min-width: 1200px) {
        .projects {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
